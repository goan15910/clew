name: spec graph and emit
vars:
  clew: node_modules/.bin/tsx src/cli.ts
  root: .
testcases:
- name: build dry-run refuse and force
  steps:
  - type: exec
    script: mktemp -d
    vars:
      dir:
        from: result.systemout
        regex: '(.+)'
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec init tests/fixtures/specs/order-sentence.md --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tag --json"
    assertions:
    - result.code ShouldEqual 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec frames list --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.frames ShouldHaveLength 3
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec status --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.status
    - result.systemoutjson.layers.graph ShouldBeFalse
    - result.systemoutjson.findingsByLayer.graph.graph0.code ShouldEqual graph-absent
    - result.systemoutjson.findingsByLayer.graph.graph0.severity ShouldEqual info
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec show sentences --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.show.sentences
    - result.systemoutjson.ok ShouldBeTrue
    - result.systemoutjson.sentences.sentences0.id ShouldEqual s1
    - result.systemoutjson.sentences.sentences0.state ShouldEqual original
    - result.systemoutjson.sentences.sentences0.text ShouldContainSubstring "the customer submits an order"
    - result.systemoutjson.sentences.sentences0.workflows ShouldHaveLength 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph build --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.graph.build
    - result.systemoutjson.ok ShouldBeTrue
    - result.systemoutjson.session ShouldEqual order-sentence
    - result.systemoutjson.graph.objects.objects0 ShouldEqual order
    - result.systemoutjson.graph.states ShouldHaveLength 3
    - result.systemoutjson.graph.states.states1.id ShouldEqual submitted
    - result.systemoutjson.graph.states.states1.frames.frames0 ShouldEqual fr:s1.t1
    - result.systemoutjson.graph.states.states1.frames.frames1 ShouldEqual fr:s1.t7
    - result.systemoutjson.graph.transitions.transitions0.id ShouldEqual fr:s1.t1
    - result.systemoutjson.graph.transitions.transitions0.frame ShouldEqual fr:s1.t1
    - result.systemoutjson.graph.transitions.transitions0.event ShouldEqual SUBMIT
    - result.systemoutjson.graph.transitions.transitions0.actor ShouldEqual customer
    - result.systemoutjson.graph.transitions.transitions1.id ShouldEqual fr:s1.t7
    - result.systemoutjson.graph.transitions.transitions1.from ShouldEqual submitted
    - result.systemoutjson.graph.transitions.transitions1.to ShouldEqual approved
    - result.systemoutjson.graph.transitions.transitions1.guard ShouldEqual condition:cond_s1_t12
    - result.systemoutjson.flows.flows0.id ShouldEqual W1
    - result.systemoutjson.flows.flows0.title ShouldEqual "Order lifecycle"
    - result.systemoutjson.flows.flows0.origin ShouldEqual rule
    - result.systemoutjson.flows.flows0.transitions.transitions0 ShouldEqual fr:s1.t1
    - result.systemoutjson.flows.flows0.transitions.transitions1 ShouldEqual fr:s1.t7
    - result.systemoutjson.flows.flows0.transitions ShouldHaveLength 2
    - result.systemoutjson.flows ShouldHaveLength 1
    - result.systemoutjson.findings.findings0.code ShouldEqual no-initial-state
    - result.systemoutjson.findings.findings1.code ShouldEqual no-final-state
    - result.systemoutjson.findings ShouldHaveLength 2
    - result.systemoutjson.issues ShouldHaveLength 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph build --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.flows.flows0.id ShouldEqual W1
    - result.systemoutjson.flows.flows0.title ShouldEqual "Order lifecycle"
    - result.systemoutjson.flows ShouldHaveLength 1
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec show sentences --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.sentences.sentences0.workflows ShouldHaveLength 1
    - result.systemoutjson.sentences.sentences0.workflows.workflows0.id ShouldEqual W1
    - result.systemoutjson.sentences.sentences0.workflows.workflows0.title ShouldEqual "Order lifecycle"
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec show sentences"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemout ShouldContainSubstring "session order-sentence:"
    - result.systemout ShouldContainSubstring "<- W1"
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --dry-run --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.emit
    - result.systemoutjson.ok ShouldBeTrue
    - result.systemoutjson.dryRun ShouldBeTrue
    - result.systemoutjson.id ShouldEqual orderFlows
    - result.systemoutjson.yaml ShouldContainSubstring "The customer submits an order"
    - result.systemoutjson.yaml ShouldContainSubstring "The manager approves the order if the total is under 500 dollars"
    - result.systemoutjson.workflowSet.id ShouldEqual orderFlows
    - result.systemoutjson.workflowSet.workflows.workflows0.id ShouldEqual W1
    - result.systemoutjson.workflowSet.workflows.workflows0.title ShouldEqual "Order lifecycle"
    - result.systemoutjson.workflowSet.workflows ShouldHaveLength 1
    - result.systemoutjson.chartYaml ShouldContainSubstring "clew.spec.v1"
    - result.systemoutjson.chartYaml ShouldContainSubstring "cond_s1_t12"
    - result.systemoutjson.issues ShouldHaveLength 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --out '{{.dir}}/flows.yaml' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.emit
    - result.systemoutjson.written ShouldEqual "{{.dir}}/flows.yaml"
  - type: exec
    script: "test -f '{{.dir}}/flows.yaml'"
    assertions:
    - result.code ShouldEqual 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --out '{{.dir}}/flows.yaml' --force --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.forced ShouldBeTrue
    - result.systemoutjson.written ShouldEqual "{{.dir}}/flows.yaml"
  - type: exec
    script: "cd '{{.root}}' && {{.clew}} workflows check '{{.dir}}/flows.yaml' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.ok ShouldBeTrue
    - result.systemoutjson.command ShouldEqual workflows.check
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec status --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.layers.graph ShouldBeTrue
    - result.systemoutjson.findingsByLayer.graph.graph0.code ShouldNotEqual graph-absent
  - type: exec
    script: "find '{{.dir}}' -name graph.json -o -name flows.json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemout ShouldContainSubstring flows.json
    - result.systemout ShouldNotContainSubstring graph.json

- name: group split and trace
  steps:
  - type: exec
    script: mktemp -d
    vars:
      dir:
        from: result.systemout
        regex: '(.+)'
  - type: exec
    script: "printf '%s\n' 'When the customer submits an order, the manager approves the order if the total is under 500 dollars. The customer cannot approve the order.' > '{{.dir}}/order-rules.md' && cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec init '{{.dir}}/order-rules.md' --json >/dev/null && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tag --json >/dev/null && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec frames list --json >/dev/null && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph build --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.ok ShouldBeTrue
    - result.systemoutjson.flows.flows0.id ShouldEqual W1
    - result.systemoutjson.flows.flows0.title ShouldEqual "Order lifecycle"
    - result.systemoutjson.flows.flows0.origin ShouldEqual rule
    - result.systemoutjson.flows.flows0.expect ShouldEqual accepted
    - result.systemoutjson.flows.flows0.transitions.transitions0 ShouldEqual fr:s1.t1
    - result.systemoutjson.flows.flows0.transitions.transitions1 ShouldEqual fr:s1.t7
    - result.systemoutjson.flows.flows1.id ShouldEqual W2
    - result.systemoutjson.flows.flows1.expect ShouldEqual rejected
    - result.systemoutjson.flows.flows1.title ShouldEqual "Cannot approve order"
    - result.systemoutjson.flows.flows1.forbidden ShouldEqual fr:s2.t1
    - result.systemoutjson.flows.flows1.transitions.transitions0 ShouldEqual fr:s1.t7
    - result.systemoutjson.flows ShouldHaveLength 2
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph split --id W1 --at fr:s1.t7 --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.graph.split
    - result.systemoutjson.changed.changed0 ShouldEqual W1
    - result.systemoutjson.changed.changed1 ShouldEqual W3
    - result.systemoutjson.flows.flows0.id ShouldEqual W1
    - result.systemoutjson.flows.flows0.title ShouldEqual "Submit order"
    - result.systemoutjson.flows.flows0.origin ShouldEqual agent
    - result.systemoutjson.flows.flows0.transitions.transitions0 ShouldEqual fr:s1.t1
    - result.systemoutjson.flows.flows1.expect ShouldEqual rejected
    - result.systemoutjson.flows.flows2.id ShouldEqual W3
    - result.systemoutjson.flows.flows2.title ShouldEqual "Approve order"
    - result.systemoutjson.flows.flows2.origin ShouldEqual agent
    - result.systemoutjson.flows.flows2.transitions.transitions0 ShouldEqual fr:s1.t7
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph group --id W1 --id W3 --title 'Submit and approve an order' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.graph.group
    - result.systemoutjson.ok ShouldBeTrue
    - result.systemoutjson.changed.changed0 ShouldEqual W1
    - result.systemoutjson.flows.flows0.title ShouldEqual "Submit and approve an order"
    - result.systemoutjson.flows.flows0.origin ShouldEqual agent
    - result.systemoutjson.flows.flows0.transitions.transitions0 ShouldEqual fr:s1.t1
    - result.systemoutjson.flows.flows0.transitions.transitions1 ShouldEqual fr:s1.t7
    - result.systemoutjson.flows.flows1.expect ShouldEqual rejected
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --out '{{.dir}}/clean.yaml' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.emit
    - result.systemoutjson.written ShouldEqual "{{.dir}}/clean.yaml"
    - result.systemoutjson.id ShouldEqual orderFlows
    - result.systemoutjson.workflowSet.workflows.workflows1.expect ShouldEqual rejected
    - result.systemoutjson.issues ShouldHaveLength 0
  - type: exec
    script: "cd '{{.root}}' && {{.clew}} workflows check '{{.dir}}/clean.yaml' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.ok ShouldBeTrue
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph split --id W1 --at fr:s1.t7 --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.graph.split
    - result.systemoutjson.changed.changed0 ShouldEqual W1
    - result.systemoutjson.changed.changed1 ShouldEqual W3
    - result.systemoutjson.flows.flows0.transitions.transitions0 ShouldEqual fr:s1.t1
    - result.systemoutjson.flows.flows2.id ShouldEqual W3
    - result.systemoutjson.flows.flows2.origin ShouldEqual agent
    - result.systemoutjson.flows.flows1.expect ShouldEqual rejected
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec trace fr:s1.t7 --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.chain.chain0.layer ShouldEqual transition
    - result.systemoutjson.chain.chain0.id ShouldEqual fr:s1.t7
    - result.systemoutjson.chain.chain0.text ShouldEqual "submitted → approved"
    - result.systemoutjson.chain.chain1.layer ShouldEqual frame
    - result.systemoutjson.chain.chain1.text ShouldEqual "the manager approves the order"
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec trace W1 --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.chain.chain0.layer ShouldEqual flow
    - result.systemoutjson.chain.chain0.id ShouldEqual W1
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph split --id W9 --at 2 --json"
    assertions:
    - result.code ShouldEqual 2
    - result.systemerr ShouldContainSubstring "unknown flow"
    - result.systemoutjson.ok ShouldBeFalse
    - result.systemoutjson.fault ShouldEqual session
    - result.systemoutjson.issues.issues0.kind ShouldEqual input

- name: usage and an uncovered forbidden frame
  steps:
  - type: exec
    script: mktemp -d
    vars:
      dir:
        from: result.systemout
        regex: '(.+)'
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --json"
    assertions:
    - result.code ShouldEqual 2
    - result.systemerr ShouldContainSubstring "emit needs --dry-run or --out"
    - result.systemoutjson.command ShouldEqual spec.emit
    - result.systemoutjson.ok ShouldBeFalse
    - result.systemoutjson.fault ShouldEqual usage
  - type: exec
    script: "printf '%s\n' 'The customer cannot cancel a shipped order.' > '{{.dir}}/cancel.md' && cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec init '{{.dir}}/cancel.md' --json >/dev/null && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tag --json >/dev/null && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec frames list --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.frames.frames0.negated ShouldBeTrue
    - result.systemoutjson.frames.frames0.compiled.kind ShouldEqual forbidden
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph build --json"
    assertions:
    - result.code ShouldEqual 1
    - result.systemoutjson.command ShouldEqual spec.graph.build
    - result.systemoutjson.findings.findings0.code ShouldEqual forbidden-uncovered
    - result.systemoutjson.findings.findings0.severity ShouldEqual blocking
    - result.systemoutjson.flows ShouldHaveLength 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --dry-run --json"
    assertions:
    - result.code ShouldEqual 1
    - result.systemoutjson.findings.findings0.code ShouldEqual forbidden-uncovered

- name: human graph summary
  steps:
  - type: exec
    script: mktemp -d
    vars:
      dir:
        from: result.systemout
        regex: '(.+)'
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec init tests/fixtures/specs/order-sentence.md --json && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tag --json && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec frames list --json"
    assertions:
    - result.code ShouldEqual 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec graph build"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemout ShouldContainSubstring "3 states, 2 transitions, 1 flows"
    - result.systemout ShouldContainSubstring "warning no-initial-state"
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec emit --dry-run"
    assertions:
    - result.code ShouldEqual 0
    - result.systemout ShouldContainSubstring "dry run"
    - result.systemout ShouldContainSubstring orderFlows

name: spec tla export and check
vars:
  clew: node_modules/.bin/tsx src/cli.ts
  root: .
testcases:
- name: export writes a frames module and a model that checks clean, and keeps the model afterwards
  steps:
  - type: exec
    script: mktemp -d
    vars:
      dir:
        from: result.systemout
        regex: '(.+)'
  - type: exec
    script: |
      printf '%s\n' 'The clerk packs the order.' 'When the clerk packs the order, the courier ships the order.' > '{{.dir}}/depot.md'
      cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec init '{{.dir}}/depot.md' --json && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tag --json && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec frames list --json
    assertions:
    - result.code ShouldEqual 0
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tla export --dry-run --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.tla.export
    - result.systemoutjson.module ShouldEqual OrderFrames
    - result.systemoutjson.dryRun ShouldEqual true
    - 'result.systemoutjson.tla ShouldContainSubstring "MODULE OrderFrames"'
    - 'result.systemoutjson.tla ShouldContainSubstring "fr:s1.t1"'
    - result.systemoutjson.actions.actions0.action ShouldEqual Pack
    - result.systemoutjson.actions.actions0.restatedBy.restatedBy0 ShouldEqual fr:s2.t1
    - result.systemoutjson.model.module ShouldEqual Order
    - 'result.systemoutjson.model.tla ShouldContainSubstring "Frames == INSTANCE OrderFrames WITH"'
    - result.systemoutjson.check.module ShouldEqual OrderCheck
    - 'result.systemoutjson.check.tla ShouldContainSubstring "Cover_Pack == Next"'
    - 'result.systemoutjson.check.cfg ShouldContainSubstring "PROPERTY RefinesFrames"'
    - 'result.systemoutjson.check.coverageCfg ShouldContainSubstring "SPECIFICATION CoverSpec"'
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tla export --out '{{.dir}}/DepotFrames.tla' --model '{{.dir}}/Depot.tla' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.module ShouldEqual DepotFrames
    - result.systemoutjson.written ShouldHaveLength 4
    - result.systemoutjson.written.written0 ShouldEqual "{{.dir}}/DepotFrames.tla"
    - result.systemoutjson.written.written1 ShouldEqual "{{.dir}}/DepotCheck.tla"
    - result.systemoutjson.model.written ShouldEqual "{{.dir}}/Depot.tla"
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tla export --out '{{.dir}}/DepotFrames.tla' --model '{{.dir}}/Depot.tla' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemoutjson.written ShouldHaveLength 4
    - result.systemoutjson.model.kept ShouldEqual true
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tla check '{{.dir}}/Depot.tla' --json"
    assertions:
    - result.code ShouldEqual 0
    - result.systemerr ShouldBeEmpty
    - result.systemoutjson.command ShouldEqual spec.tla.check
    - result.systemoutjson.module ShouldEqual Depot
    - result.systemoutjson.framesModule ShouldEqual DepotFrames
    - result.systemoutjson.findings ShouldBeEmpty
    - result.systemoutjson.files ShouldHaveLength 4
    - result.systemoutjson.files.files0.state ShouldEqual current
    - result.systemoutjson.actions.actions0.cover ShouldEqual Cover_Pack
    - 'result.systemoutjson.run.coverage ShouldContainSubstring "-coverage 1 -config DepotCoverage.cfg DepotCheck.tla"'
  - type: exec
    script: |
      echo '\* edited' >> '{{.dir}}/DepotCheck.cfg'
      cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec tla check '{{.dir}}/Depot.tla'
    assertions:
    - result.code ShouldEqual 1
    - result.systemerr ShouldBeEmpty
    - 'result.systemout ShouldContainSubstring "blocking check-files-stale"'
  - type: exec
    script: "cd '{{.root}}' && CLEW_DATA_DIR='{{.dir}}' {{.clew}} spec frames list"
    assertions:
    - result.code ShouldEqual 0
    - 'result.systemout ShouldContainSubstring "when order_status = null"'

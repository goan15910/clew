# Valid spec. stuck and island are labeled but never assigned, so the
# location projection reports them unreachable and as dead ends.
kind: clew.spec.v1
id: deadEnd
vars:
  - { id: phase, type: atom }
  - { id: done, type: boolean }
initial:
  phase: start
  done: false
actions:
  - event: FINISH
    actor: user
    when: { op: eq, var: phase, value: start }
    assign: { phase: done, done: true }
labels:
  - { id: start, match: { phase: start }, text: Start }
  - { id: done, match: { phase: done }, text: Done, final: true }
  - { id: stuck, match: { phase: stuck }, text: Stuck }
  - { id: island, match: { phase: island }, text: Island }

# Valid chart. stuck and island are not reachable from start.
# Neither is final and neither has an outgoing transition, so both are dead ends.
id: deadEnd
initial: start
guards: []
effects:
  - { name: markDone, sets: done }
states:
  - id: start
    label: Start
    data: {}
  - id: done
    label: Done
    final: true
    data:
      done: boolean
  - id: stuck
    label: Stuck
    data: {}
  - id: island
    label: Island
    data: {}
transitions:
  - { from: start, event: FINISH, to: done, actor: user, effect: markDone }

name: pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack and smoke-install
        run: scripts/smoke-install.sh
      - name: Install script methods and version stamps
        run: bash scripts/test-install-clew.sh

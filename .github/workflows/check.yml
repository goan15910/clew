name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Graphviz debs
        uses: actions/cache@v4
        with:
          path: .cache/graphviz
          key: graphviz-16.1.0-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-v1
      - name: Install Graphviz 16.1.0
        run: bash scripts/install-graphviz.sh
        env:
          GRAPHVIZ_CACHE_DIR: ${{ github.workspace }}/.cache/graphviz
      - run: npx tsc --noEmit
      - run: npm run check:dependencies
      - run: npm run check:imports
      - run: npm run test:architecture
      - run: npm run test:spec

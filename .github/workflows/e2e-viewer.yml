name: e2e-viewer

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-viewer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright-spec-view:
    name: Playwright spec view (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Graphviz debs
        uses: actions/cache@v4
        with:
          path: .cache/graphviz
          key: graphviz-16.1.0-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-v1

      - name: Install Graphviz 16.1.0
        run: bash scripts/install-graphviz.sh
        env:
          GRAPHVIZ_CACHE_DIR: ${{ github.workspace }}/.cache/graphviz

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e (spec view)
        id: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true

      - name: Publish CTRF GitHub summary
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          github-report: true
          summary-report: true
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write matrix summary
        if: always()
        run: |
          {
            echo "## Spec view Playwright e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
            echo
            echo 'Adds Playwright coverage for the HTML inspector from `clew spec view` (PR #22 viewer).'
            echo
            echo '| Dimension | Values |'
            echo '| --- | --- |'
            echo '| Views | facts, entities, sentences (3) |'
            echo '| Entity kind | any, actor, object, action, condition (5) |'
            echo '| Fact type | any, performs, transition, guard, initial, final, forbidden (7) |'
            echo '| Fact status | any, current, stale (3) |'
            echo '| Searches | empty, f1, customer, s1, approve, zzzz-no-match (6) |'
            echo
            echo 'Parametrized cases: views×kinds (15) + views×types (21) + views×statuses (9) + views×searches (18) + facts kind×type×status (105) + entities kind×search (30) + lineage/interaction (8) = **206**.'
            echo
            if [ -f ctrf/ctrf-report.json ]; then
              node -e '
                const r = require("./ctrf/ctrf-report.json");
                const s = r.results?.summary ?? r.summary ?? {};
                const tests = s.tests ?? s.total ?? "?";
                const passed = s.passed ?? "?";
                const failed = s.failed ?? "?";
                console.log(`CTRF totals: **${tests}** tests, **${passed}** passed, **${failed}** failed.`);
              '
            else
              echo 'CTRF report was not produced.'
            fi
            echo
            echo 'Artifacts: Allure report (`allure-report-spec-view`), Playwright HTML report, failure traces/videos.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-spec-view-${{ matrix.shard }}
          path: allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-spec-view-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload traces and videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-spec-view-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # Single check name for humans / branch filters; shards above do the work.
  playwright-spec-view-result:
    name: Playwright spec view
    needs: playwright-spec-view
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards
        run: |
          echo "shard_result=${{ needs.playwright-spec-view.result }}"
          test "${{ needs.playwright-spec-view.result }}" = "success"

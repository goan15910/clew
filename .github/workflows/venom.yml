name: venom

on:
  pull_request:
  push:
    branches: [main]

jobs:
  venom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Graphviz 16.1.0
        run: bash scripts/install-graphviz.sh
      - name: Install Venom v1.3.0
        run: bash scripts/install-venom.sh
      - name: Run Venom
        run: |
          bin/venom run tests/venom \
            --format=xml \
            --output-dir=venom-results \
            --html-report \
            --var "root=${GITHUB_WORKSPACE}" \
            --var "clew=node_modules/.bin/tsx src/cli.ts"
      - name: Publish the job summary
        if: ${{ !cancelled() }}
        run: node scripts/venom-step-summary.mjs venom-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Venom report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: venom-report
          retention-days: 14
          path: |
            venom-results/*.xml
            venom-results/*.html
            venom-results/venom.log
          if-no-files-found: error

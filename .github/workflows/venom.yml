name: venom

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: venom-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  venom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Graphviz debs
        uses: actions/cache@v4
        with:
          path: .cache/graphviz
          key: graphviz-16.1.0-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-v1
      - name: Install Graphviz 16.1.0
        run: bash scripts/install-graphviz.sh
        env:
          GRAPHVIZ_CACHE_DIR: ${{ github.workspace }}/.cache/graphviz
      - name: Install Venom v1.3.0
        run: bash scripts/install-venom.sh
      - name: Build CLI
        run: npm run build
      - name: Run Venom
        run: bash scripts/run-venom-ci.sh "${GITHUB_WORKSPACE}" "node dist/cli.js"
      - name: Publish the job summary
        if: ${{ !cancelled() }}
        run: node scripts/venom-step-summary.mjs venom-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Venom report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: venom-report
          retention-days: 14
          path: |
            venom-results/*.xml
            venom-results/*.html
            venom-results/venom.log
          if-no-files-found: error

# Invalid: setPriority sets `priority`, which the target state todo does not declare.
id: todoTask
initial: draft
guards: []
effects:
  - { name: setPriority, sets: priority }
states:
  - id: draft
    label: Draft
    data:
      title: string
  - id: todo
    label: Todo
    data:
      title: string
      listed: boolean
transitions:
  - { from: draft, event: SUBMIT, to: todo, actor: user, effect: setPriority }

# Candidate b-full. Trash can be restored, a todo can be completed directly,
# archive is only from Done, and an archived task can come back.
kind: clew.spec.v1
id: todoTask
vars:
  - { id: phase, type: atom }
  - { id: listed, type: boolean }
  - { id: title, type: atom }
  - { id: started_at, type: timestamp }
  - { id: completed_at, type: timestamp }
  - { id: wake_at, type: timestamp }
  - { id: deleted_at, type: timestamp }
initial:
  phase: draft
  listed: false
  title: task
  started_at: null
  completed_at: null
  wake_at: null
  deleted_at: null
actions:
  - event: SUBMIT
    actor: user
    when:
      op: and
      of:
        - { op: eq, var: phase, value: draft }
        - { op: neq, var: title, value: "" }
    assign: { phase: todo, listed: true }
  - event: DELETE
    actor: user
    when: { op: eq, var: phase, value: draft }
    assign: { phase: deleted, deleted_at: set }
  - event: START
    actor: user
    when: { op: eq, var: phase, value: todo }
    assign: { phase: inProgress, started_at: set }
  - event: COMPLETE
    actor: user
    when: { op: eq, var: phase, value: todo }
    assign: { phase: done, completed_at: set }
  - event: SNOOZE
    actor: user
    when: { op: eq, var: phase, value: todo }
    assign: { phase: snoozed, wake_at: set }
  - event: DELETE
    actor: user
    when: { op: eq, var: phase, value: todo }
    assign: { phase: deleted, deleted_at: set }
  - event: SNOOZE
    actor: user
    when: { op: eq, var: phase, value: inProgress }
    assign: { phase: snoozed, wake_at: set }
  - event: COMPLETE
    actor: user
    when: { op: eq, var: phase, value: inProgress }
    assign: { phase: done, completed_at: set }
  - event: RESUME
    actor: "user or timer"
    when: { op: eq, var: phase, value: snoozed }
    assign: { phase: inProgress, wake_at: null }
  - event: REOPEN
    actor: user
    when: { op: eq, var: phase, value: done }
    assign: { phase: todo, completed_at: null }
  - event: ARCHIVE
    actor: user
    when:
      op: and
      of:
        - { op: eq, var: phase, value: done }
        - { op: neq, var: completed_at, value: null }
    assign: { phase: archived, listed: false }
  - event: UNARCHIVE
    actor: user
    when: { op: eq, var: phase, value: archived }
    assign: { phase: done, listed: true }
  - event: RESTORE
    actor: user
    when: { op: eq, var: phase, value: deleted }
    assign: { phase: todo, deleted_at: null }
labels:
  - { id: draft, match: { phase: draft }, text: Draft }
  - { id: todo, match: { phase: todo }, text: Todo }
  - { id: inProgress, match: { phase: inProgress }, text: In Progress }
  - { id: snoozed, match: { phase: snoozed }, text: Snoozed }
  - { id: done, match: { phase: done }, text: Done }
  - { id: archived, match: { phase: archived }, text: Archived }
  - { id: deleted, match: { phase: deleted }, text: Deleted }

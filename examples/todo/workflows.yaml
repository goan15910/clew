# Named linked lists. Each workflow is one sub-graph.
# A node's assign is a full valuation of the chart vars. An edge's event is a spec action.
# expect: accepted — every edge must be enabled and land on `to`.
# expect: rejected — the spec must refuse the edge at `rejectAt`.
# Accepted flows start at a valuation reachable from initial (here, initial itself).
id: todoFlows
workflows:
  - id: W1
    title: Create and complete a task
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: working
        assign: { phase: inProgress, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
      - id: finished
        assign: { phase: done, listed: true, title: task, started_at: set, completed_at: set, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the draft to my list" }
      - { from: listed, event: START, to: working, text: "Start working on it" }
      - { from: working, event: COMPLETE, to: finished, text: "Mark it done" }
  - id: W2
    title: Snooze and resume
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: working
        assign: { phase: inProgress, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
      - id: snoozed
        assign: { phase: snoozed, listed: true, title: task, started_at: set, completed_at: null, wake_at: set, deleted_at: null }
      - id: resumed
        assign: { phase: inProgress, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
      - id: finished
        assign: { phase: done, listed: true, title: task, started_at: set, completed_at: set, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the task" }
      - { from: listed, event: START, to: working, text: "Start it" }
      - { from: working, event: SNOOZE, to: snoozed, text: "Snooze until tomorrow" }
      - { from: snoozed, event: RESUME, to: resumed, text: "Resume it" }
      - { from: resumed, event: COMPLETE, to: finished, text: "Finish it" }
  - id: W3
    title: Reopen a done task
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: working
        assign: { phase: inProgress, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
      - id: finished
        assign: { phase: done, listed: true, title: task, started_at: set, completed_at: set, wake_at: null, deleted_at: null }
      - id: reopened
        assign: { phase: todo, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the task" }
      - { from: listed, event: START, to: working, text: "Start it" }
      - { from: working, event: COMPLETE, to: finished, text: "Finish it" }
      - { from: finished, event: REOPEN, to: reopened, text: "Reopen it" }
  - id: W4
    title: Archive a done task
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: working
        assign: { phase: inProgress, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
      - id: finished
        assign: { phase: done, listed: true, title: task, started_at: set, completed_at: set, wake_at: null, deleted_at: null }
      - id: kept
        assign: { phase: archived, listed: false, title: task, started_at: set, completed_at: set, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the task" }
      - { from: listed, event: START, to: working, text: "Start it" }
      - { from: working, event: COMPLETE, to: finished, text: "Finish it" }
      - { from: finished, event: ARCHIVE, to: kept, text: "Archive it" }
  - id: W5
    title: Delete a draft
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: gone
        assign: { phase: deleted, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: set }
    edges:
      - { from: edit, event: DELETE, to: gone, text: "Delete the draft" }
  - id: W6
    title: Restore a deleted task
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: gone
        assign: { phase: deleted, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: set }
      - id: restored
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the task" }
      - { from: listed, event: DELETE, to: gone, text: "Delete it by mistake" }
      - { from: gone, event: RESTORE, to: restored, text: "Restore it from the trash" }
  - id: W7
    title: Complete without starting
    expect: accepted
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: finished
        assign: { phase: done, listed: true, title: task, started_at: null, completed_at: set, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the task" }
      - { from: listed, event: COMPLETE, to: finished, text: "Tick it done straight away" }
  - id: W8
    title: Unfinished task cannot be archived
    expect: rejected
    rejectAt: 3
    start: edit
    nodes:
      - id: edit
        assign: { phase: draft, listed: false, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: listed
        assign: { phase: todo, listed: true, title: task, started_at: null, completed_at: null, wake_at: null, deleted_at: null }
      - id: working
        assign: { phase: inProgress, listed: true, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
      - id: kept
        assign: { phase: archived, listed: false, title: task, started_at: set, completed_at: null, wake_at: null, deleted_at: null }
    edges:
      - { from: edit, event: SUBMIT, to: listed, text: "Add the task" }
      - { from: listed, event: START, to: working, text: "Start it" }
      - { from: working, event: ARCHIVE, to: kept, text: "Try to archive it before it is done" }

# Chart ids and events on the left, workflow vocabulary on the right.
# a-basic and b-full share this file. a-basic is missing restore, unarchive,
# and completing a todo directly, so W6, W7, and W8 fail against it.
chart: todoTask
workflowSet: todoFlows
states:
  - { chart: draft, workflow: editing }
  - { chart: todo, workflow: open }
  - { chart: inProgress, workflow: active }
  - { chart: snoozed, workflow: paused }
  - { chart: done, workflow: closed }
  - { chart: archived, workflow: kept }
  - { chart: deleted, workflow: gone }
events:
  - { chart: SUBMIT, workflow: submit }
  - { chart: START, workflow: start }
  - { chart: COMPLETE, workflow: complete }
  - { chart: SNOOZE, workflow: snooze }
  - { chart: RESUME, workflow: resume }
  - { chart: REOPEN, workflow: reopen }
  - { chart: ARCHIVE, workflow: archive }
  - { chart: DELETE, workflow: delete }
  - { chart: RESTORE, workflow: restore }
  - { chart: UNARCHIVE, workflow: unarchive }
